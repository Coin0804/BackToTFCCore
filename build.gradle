plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

group = 'com.backtotfccore'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

base {
    archivesName = 'BackToTFCCore'
}

minecraft {
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.233"
}
