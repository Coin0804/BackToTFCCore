plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.120'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.named('processResources', ProcessResources).configure {
    filesMatching('**/*.toml') {
        expand(project.properties)
    }
    filesMatching('**/*.mcmeta') {
        expand(project.properties)
    }
}

base {
    archivesName = "${mod_id}-neoforge-${mod_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
}

dependencies {
    // NeoForge 由 moddev 插件自动提供
    // JEI API — compileOnly（可选集成）；fileTree glob 展开 mods 目录，mod 升级无需改此处
    compileOnly fileTree('../../mods') { include '*jei-1.21.1-neoforge-*.jar' }
    // TFC — compileOnly（Mixin 目标）
    compileOnly fileTree('../../mods') { include '*TerraFirmaCraft-NeoForge-*.jar' }
    // AdvancedTFCTech — compileOnly（Mixin 目标）
    compileOnly fileTree('../../mods') { include '*AdvancedTFCTech-NeoForge-*.jar' }
    // Immersive Engineering — compileOnly（codec 依赖）
    compileOnly fileTree('../../mods') { include '*ImmersiveEngineering-*.jar' }
    // DualCodecs — IE 的 JarJar 依赖，编译时需要
    compileOnly fileTree('libs') { include '*DualCodecs-*.jar' }
    // LDLib2 — ModularUI + 数据同步框架
    compileOnly fileTree('../../mods') { include '*ldlib2-neoforge-*.jar' }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
